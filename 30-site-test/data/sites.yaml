# the-30-site-test — default site list (30 sites across 5 gating categories).
#
# This is a STARTER list. The `oracle` for each site is a best-effort brand/title
# string; validate and adjust it against a known-good fetch before trusting a
# site's numbers (see README "Tune your oracles"). `requires_geo` is the region an
# egress arm must reach to test the site; sites in regions you can't egress from
# are recorded as `not_tested`, not failures.
#
# gating_type: geo_restricted | anti_fraud | login_gated | publisher_cdn | long_tail

# ── long_tail — permissive baseline (should be content_ok from any origin) ──────
- id: example-open
  url: https://example.com/
  region: US
  gating_type: long_tail
  requires_geo: US
  oracle: { type: css, match: "h1" }
- id: httpbin-html
  url: https://httpbin.org/html
  region: US
  gating_type: long_tail
  requires_geo: US
  oracle: { type: regex, match: "Herman Melville" }
- id: wikipedia-scraping
  url: https://en.wikipedia.org/wiki/Web_scraping
  region: US
  gating_type: long_tail
  requires_geo: US
  oracle: { type: regex, match: "Web scraping" }
- id: hacker-news
  url: https://news.ycombinator.com/
  region: US
  gating_type: long_tail
  requires_geo: US
  oracle: { type: regex, match: "Hacker News" }
- id: mdn-web-docs
  url: https://developer.mozilla.org/en-US/
  region: US
  gating_type: long_tail
  requires_geo: US
  oracle: { type: regex, match: "MDN" }
- id: python-docs
  url: https://docs.python.org/3/
  region: US
  gating_type: long_tail
  requires_geo: US
  oracle: { type: regex, match: "Python" }

